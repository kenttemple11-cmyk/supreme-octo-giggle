<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MMR Watch — Rocket League tracker</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrap">
    <header class="top">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 40 40" width="30" height="30" aria-hidden="true">
          <path d="M4 26 L20 6 L36 26 L28 26 L28 34 L12 34 L12 26 Z" fill="currentColor" />
        </svg>
        <div>
          <h1>MMR Watch</h1>
          <p class="subtitle">Live rank tracking, powered by the Tracker Network API</p>
        </div>
      </div>

      <div class="poll-control">
        <label for="pollRate">Refresh every</label>
        <select id="pollRate">
          <option value="15000">15s</option>
          <option value="30000" selected>30s</option>
          <option value="60000">60s</option>
          <option value="120000">2m</option>
        </select>
      </div>
    </header>

    <form id="addForm" class="add-form">
      <select id="platform" aria-label="Platform">
        <option value="steam">Steam</option>
        <option value="epic">Epic</option>
        <option value="psn">PlayStation</option>
        <option value="xbl">Xbox</option>
        <option value="switch">Switch</option>
      </select>
      <input id="identifier" type="text" placeholder="Exact handle, SteamID64, or vanity name" autocomplete="off" required />
      <button type="submit">Track player</button>
    </form>
    <p class="hint">Steam accepts a vanity name or SteamID64. Epic/PSN/Xbox need the exact display name.</p>

    <div id="empty" class="empty">
      <p>No players tracked yet. Add one above to see live MMR, tier, and session deltas.</p>
    </div>

    <div id="grid" class="grid"></div>
  </div>

  <template id="cardTemplate">
    <article class="card">
      <div class="card-head">
        <div class="who">
          <span class="platform-badge"></span>
          <h2 class="handle"></h2>
        </div>
        <div class="card-actions">
          <span class="updated"></span>
          <button class="debug-btn" title="View raw API response">raw</button>
          <button class="remove-btn" title="Stop tracking">✕</button>
        </div>
      </div>
      <div class="card-error" hidden></div>
      <div class="playlists"></div>
    </article>
  </template>

  <template id="playlistTemplate">
    <div class="playlist">
      <div class="playlist-top">
        <span class="playlist-name"></span>
        <span class="tier-badge"></span>
      </div>
      <div class="mmr-row">
        <span class="mmr-value"></span>
        <span class="mmr-delta"></span>
      </div>
      <canvas class="sparkline" width="220" height="44"></canvas>
    </div>
  </template>

  <script src="app.js"></script>
</body>
</html>
